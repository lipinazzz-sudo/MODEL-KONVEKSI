<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- PERBAIKAN MOBILE: Mencegah zoom otomatis saat klik input di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Owlet Kids - Harga CMT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .font-cute { font-family: 'Fredoka', sans-serif; }
        
        /* Kustomisasi Scrollbar agar imut */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(224, 231, 255, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #a5b4fc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        .slide-content {
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1; transform: translateY(0) scale(1);
        }
        .slide-hidden { opacity: 0; transform: translateY(20px) scale(0.95); }
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-show { transform: translateY(0); opacity: 1; }

        @keyframes floatSlow {
            0% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-15px) translateX(15px); }
            100% { transform: translateY(0px) translateX(0px); }
        }
        @keyframes floatFast {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(-10px) translateX(-10px) rotate(5deg); }
            100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
        }
        .animate-float-slow { animation: floatSlow 8s ease-in-out infinite; }
        .animate-float-fast { animation: floatFast 5s ease-in-out infinite; }

        .btn-3d { transition: all 0.1s; }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-400 via-blue-200 to-orange-100 text-indigo-950 min-h-screen flex flex-col justify-start items-center p-3 md:p-6 overflow-x-hidden relative selection:bg-pink-300 selection:text-pink-900">

    <!-- Modal Zoom -->

                <input type="text" id="searchInput" oninput="searchModel(this.value)" placeholder="Cari model..." class="w-full bg-indigo-50 border-2 border-indigo-200 rounded-2xl pl-9 md:pl-10 pr-3 md:pr-4 py-2.5 md:py-3 text-sm font-bold text-indigo-900 placeholder-indigo-300 focus:outline-none focus:border-yellow-400 focus:ring-4 focus:ring-yellow-200/50 transition-all shadow-inner">

    <!-- Kontainer Utama: Dibuat lebih adaptif untuk HP -->

        <button type="button" onclick="changeSlide('next')" class="btn-3d w-12 h-12 flex items-center justify-center rounded-full border-2 border-indigo-200 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 shadow-[0_4px_0_#c7d2fe] transition-all">
            <span class="text-xl md:text-2xl font-bold select-none">👉</span>

   <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1L24DsxwQ0uLxblnKzJ3YzH91gnsXuEhb8OVcRsH3WNo/edit?gid=0#gid=0";

    let database = [], highlightedIndex = -1, currentSlideIndex = 0, currentTotalHPP = 0;
    let isTableView = false; 
    let compareSlideIndex = null; 
    let compareActive = false; 
    
    const orderedCategories = ["OBRAS", "JAHIT", "KAM", "KARET", "BIS", "NECCI", "PACKING"];
    const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1519689680058-324335c77eba?q=80&w=600&auto=format&fit=crop"; 

    window.showToast = function(message, type = "success") {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        const icon = type === "success" ? "✨" : (type === "sync" ? "🔄" : "⚠️");
        const bgColor = type === "success" ? "bg-pink-400 border-pink-500" : (type === "sync" ? "bg-blue-400 border-blue-500" : "bg-red-400 border-red-500");
        
        toast.className = `flex items-center gap-2 px-4 md:px-5 py-2.5 md:py-3 rounded-full border-2 ${bgColor} text-white font-cute text-[11px] md:text-sm font-bold shadow-xl backdrop-blur-md toast-enter transition-all duration-300 whitespace-nowrap`;
        toast.innerHTML = `<span class="text-base md:text-lg">${icon}</span> <span>${message}</span>`;
        
        container.appendChild(toast);
        setTimeout(() => { toast.classList.remove('toast-enter'); toast.classList.add('toast-show'); }, 10);
        setTimeout(() => { toast.classList.remove('toast-show'); toast.classList.add('toast-enter'); setTimeout(() => toast.remove(), 300); }, 3000);
    };

    // LOGIKA DRAG & ZOOM
    let isZoomed = false, scaleValue = 1, isDragging = false, dragMoved = false; 
    let startX, startY, translateX = 0, translateY = 0;

    function updateTransform() { document.getElementById('modalImg').style.transform = `translate(${translateX}px, ${translateY}px) scale(${scaleValue})`; }

    window.openZoom = function(imgSrc) {
        const modal = document.getElementById('imageModal'), modalImg = document.getElementById('modalImg');
        modalImg.src = imgSrc; isZoomed = false; scaleValue = 1; translateX = 0; translateY = 0; updateTransform();
        modalImg.className = "max-w-full max-h-[90vh] object-contain rounded-[2rem] shadow-[0_0_40px_rgba(255,255,255,0.5)] border-4 border-white transition-transform duration-300 cursor-zoom-in relative bg-white";
        modal.classList.remove('hidden'); modal.classList.add('flex'); document.body.style.overflow = 'hidden'; 
    };

    window.closeZoom = function() {
        const modal = document.getElementById('imageModal');
        modal.classList.add('hidden'); modal.classList.remove('flex'); document.body.style.overflow = ''; 
    };

    window.toggleZoom = function(event) {
        event.stopPropagation(); if (dragMoved) { dragMoved = false; return; }
        isZoomed = !isZoomed;
        const modalImg = document.getElementById('modalImg');
        if (isZoomed) { scaleValue = 2; modalImg.classList.replace('cursor-zoom-in', 'cursor-grab'); } 
        else { scaleValue = 1; translateX = 0; translateY = 0; modalImg.classList.remove('cursor-grab', 'cursor-grabbing'); modalImg.classList.add('cursor-zoom-in'); }
        updateTransform();
    };
    
    window.startDrag = function(event) {
        if (!isZoomed) return; if(event.cancelable) event.preventDefault(); 
        isDragging = true; dragMoved = false; 
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        startX = clientX - translateX; 
        startY = clientY - translateY; 
        document.getElementById('modalImg').classList.replace('cursor-grab', 'cursor-grabbing');
        document.getElementById('modalImg').classList.remove('transition-transform', 'duration-300'); 
    };

    window.onDrag = function(event) {
        if (!isDragging || !isZoomed) return; dragMoved = true; 
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        translateX = clientX - startX; translateY = clientY - startY; updateTransform();
    };

    window.endDrag = function() {
        if (!isDragging) return; isDragging = false;
        const modalImg = document.getElementById('modalImg');
        modalImg.classList.replace('cursor-grabbing', 'cursor-grab'); modalImg.classList.add('transition-transform', 'duration-300'); 
    };

    function getCategoryStyle(cat) {
        const styles = { 
            "OBRAS": "bg-orange-100 text-orange-700 border-orange-300", 
            "JAHIT": "bg-blue-100 text-blue-700 border-blue-300", 
            "KAM": "bg-pink-100 text-pink-700 border-pink-300", 
            "KARET": "bg-purple-100 text-purple-700 border-purple-300", 
            "BIS": "bg-yellow-100 text-yellow-700 border-yellow-400", 
            "NECCI": "bg-emerald-100 text-emerald-700 border-emerald-300", 
            "PACKING": "bg-indigo-100 text-indigo-700 border-indigo-300" 
        };
        return styles[cat] ? `border-2 ${styles[cat]}` : "bg-gray-100 text-gray-700 border-2 border-gray-300";
    }

    function konversiLinkDrive(url) {
        if (!url) return "";
        if (url.includes("drive.google.com")) {
            let match = url.match(/\/d\/([a-zA-Z0-9-_]+)/) || url.match(/id=([a-zA-Z0-9-_]+)/);
            if (match && match[1]) { return `https://lh3.googleusercontent.com/d/${match[1]}`; }
        }
        return url; 
    }

    function parseCSVToJSON(csvText) {
        const lines = csvText.split(/\r?\n/); const modelsMap = {};
        const delimiter = (lines[0] || "").includes(";") ? ";" : ",";

        for (let i = 1; i < lines.length; i++) {
            let line = lines[i].trim(); if (!line) continue;
            let columns = [], inQuotes = false, currentColumn = "";
            for (let j = 0; j < line.length; j++) {
                let char = line[j];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === delimiter && !inQuotes) { columns.push(currentColumn.trim()); currentColumn = ""; }
                else currentColumn += char;
            }
            columns.push(currentColumn.trim());
            if (columns.length < 4) continue;

            const modelName = columns[0].replace(/^"|"$/g, '').trim();
            const category = columns[1].replace(/^"|"$/g, '').trim().toUpperCase();
            const details = columns[2].replace(/^"|"$/g, '').trim();
            const price = parseInt(columns[3].replace(/[^0-9]/g, '')) || 0;
            let rawImageUrl = (columns[4] && columns[4].trim()) ? columns[4].replace(/^"|"$/g, '').trim() : "";
            let hargaCMT = parseInt((columns[5] || "").replace(/[^0-9]/g, '')) || 0;

            if (!modelName) continue;
            if (!modelsMap[modelName]) {
                modelsMap[modelName] = { name: modelName, items: [], image: konversiLinkDrive(rawImageUrl), hargaCMT: hargaCMT };
            } else {
                if (modelsMap[modelName].hargaCMT === 0 && hargaCMT > 0) modelsMap[modelName].hargaCMT = hargaCMT;
                if (!modelsMap[modelName].image && rawImageUrl) modelsMap[modelName].image = konversiLinkDrive(rawImageUrl);
            }
            modelsMap[modelName].items.push({ category, details, price });
        }
        return Object.values(modelsMap);
    }

    async function fetchSheetData(isManual = false) {
        const syncStatus = document.getElementById('syncStatus');
        syncStatus.innerHTML = `TUNGGU YA...`;
        syncStatus.className = "text-[10px] md:text-xs font-cute text-amber-700 font-bold bg-amber-200 px-2 py-0.5 md:px-3 md:py-1 rounded-full border border-amber-400 mt-0.5 inline-block animate-pulse";

        try {
            let csvFetchUrl = GOOGLE_SHEET_CSV_URL;
            if (csvFetchUrl.includes("/edit")) { csvFetchUrl = csvFetchUrl.replace(/\/edit.*/, "/export?format=csv"); }

            const response = await fetch(csvFetchUrl + "&cache_buster=" + Date.now());
            if (!response.ok) throw new Error("Gagal mengambil data");
            const csvText = await response.text();
            if (!csvText.trim() || csvText.includes("<!DOCTYPE html>")) throw new Error("Akses ditolak");

            const oldModelName = database[currentSlideIndex]?.name;
            database = parseCSVToJSON(csvText);

            if (database.length > 0) {
                if (oldModelName) {
                    const newIndex = database.findIndex(m => m.name === oldModelName);
                    if (newIndex !== -1) currentSlideIndex = newIndex;
                }
                if(isManual) {
                    if(!isTableView) changeSlide('none');
                    else renderMasterTable(document.getElementById('searchInput').value);
                    showToast("Yay! Data terupdate!", "success");
                } else renderSlide(); 
            } else {
                document.getElementById('slideContainer').innerHTML = '<div class="text-center py-24 font-cute text-pink-500 text-lg font-bold">Ups! Tabel data kosong 🥺</div>';
            }
            
            syncStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ONLINE`;
            syncStatus.className = "text-[10px] md:text-xs font-cute text-emerald-700 font-bold flex items-center gap-1.5 justify-center md:justify-start transition-colors mt-0.5 bg-emerald-100 px-2 md:px-3 py-0.5 md:py-1 rounded-full border border-emerald-300 inline-flex shadow-sm";
        } catch (error) {
            console.error(error);
            syncStatus.innerHTML = `YAHH OFFLINE 😢`;
            syncStatus.className = "text-[10px] md:text-xs font-cute text-red-700 font-bold flex items-center gap-1.5 justify-center md:justify-start transition-colors mt-0.5 bg-red-100 px-2 md:px-3 py-0.5 md:py-1 rounded-full border border-red-300 inline-flex shadow-sm";
            if(isManual) showToast("Yahh gagal sinkron.", "error");
        }
    }

    window.manualRefresh = function() { fetchSheetData(true); };

    // ======= LOGIKA MASTER TABLE =======
    window.toggleViewMode = function() {
        if (database.length === 0) return;
        isTableView = !isTableView;
        compareSlideIndex = null; 
        compareActive = false; 
        const nav = document.querySelector('nav'); 

        const container = document.getElementById('slideContainer');
        container.classList.add('slide-hidden');
        
        setTimeout(() => {
            const currentSearchValue = document.getElementById('searchInput').value;
            if (isTableView) {
                nav.classList.add('hidden'); 
                renderMasterTable(currentSearchValue);
            } else {
                nav.classList.remove('hidden'); 
                renderSlide(); 
            }
            container.classList.remove('slide-hidden');
            
            const searchInput = document.getElementById('searchInput');

    window.selectModelFromTable = function(index) {
        currentSlideIndex = index;
        isTableView = false;
        compareActive = true;
        compareSlideIndex = -1; 
        
        document.getElementById('searchInput').value = '';
        const nav = document.querySelector('nav');
        nav.classList.remove('hidden');
        changeSlide('none'); 

        setTimeout(() => {
            const searchInput = document.getElementById('searchInput');
            searchInput.placeholder = "Cari model kedua...";
            if (window.innerWidth > 768) searchInput.focus();
        }, 400);
    };

    function generateTextSummary() {
        if (database.length === 0) return "";
        const model = database[currentSlideIndex];
        
        let text = `*✨ RINCIAN HARGA PRODUKSI ✨*\n`;
        text += `=========================\n`;
        text += `*Nama Model:* _${model.name.toUpperCase()}_\n`;
        text += `=========================\n\n`;

        orderedCategories.forEach(cat => {
            const catItems = model.items.filter(item => item.category === cat);
            if (catItems.length > 0) {
                text += `*🏷️ ${cat}*\n`;
                let catTotal = 0;
                catItems.forEach(item => {
                    catTotal += item.price;
                    text += `  • ${item.details} = Rp ${item.price.toLocaleString('id-ID')}\n`;
                });
                text += `  *Subtotal:* Rp ${catTotal.toLocaleString('id-ID')}\n\n`;
            }
        });
        text += `=========================\n`;
        text += `*💖 TOTAL PRODUKSI : Rp ${currentTotalHPP.toLocaleString('id-ID')}*\n`;
        
        if (model.hargaCMT > 0) { text += `*🎀 HARGA CMT : Rp ${model.hargaCMT.toLocaleString('id-ID')}*\n`; }
        
        text += `=========================\n`;
        text += `_Dikirim via Aplikasi Owlet Kids_ 🦉`;
        
        return text;
    }

    window.sendToWhatsApp = function() {
        const text = generateTextSummary();
        if(text) window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    };

    window.copyDataToClipboard = function() {
        const text = generateTextSummary();
        if(!text) return;
        navigator.clipboard.writeText(text).then(() => { showToast("Rincian disalin! ✨", "success"); })
        .catch(err => { showToast("Gagal menyalin 😢", "error"); });
    };

    window.changeSlide = function(direction) {
        if (database.length === 0 || isTableView) return; 
        
        if (direction !== 'none') {
            compareActive = false;
            compareSlideIndex = null; 
            document.getElementById('searchInput').placeholder = "Cari model...";
        }

        if (direction === 'next' && currentSlideIndex < database.length - 1) currentSlideIndex++;
        else if (direction === 'prev' && currentSlideIndex > 0) currentSlideIndex--;
        else if (direction === 'none') { /* Just Re-render */ }
        else return; 

        const container = document.getElementById('slideContainer');
        container.classList.add('slide-hidden');
        setTimeout(() => { renderSlide(); container.classList.remove('slide-hidden'); }, 400); 
    };

                            <span class="text-sm md:text-base">📄</span> COPY
                        </button>
                        <button onclick="sendToWhatsApp()" class="btn-3d flex-[1.5] bg-emerald-500 hover:bg-emerald-600 text-white font-cute font-bold py-2 md:py-3 px-2 md:px-4 rounded-xl border-2 border-emerald-600 shadow-[0_4px_0_#059669] flex items-center justify-center gap-1.5 text-[10px] md:text-xs tracking-wider uppercase transition-all">
                            <span class="text-sm md:text-base">💬</span> TEKS WA
                        </button>
                        <button onclick="shareAsImage()" class="btn-3d flex-[1.5] bg-pink-500 hover:bg-pink-600 text-white font-cute font-bold py-2 md:py-3 px-2 md:px-4 rounded-xl border-2 border-pink-600 shadow-[0_4px_0_#db2777] flex items-center justify-center gap-1.5 text-[10px] md:text-xs tracking-wider uppercase transition-all" id="btnShareImg">
                            <span class="text-sm md:text-base">📸</span> FOTO WA
                        </button>
                    </div>
                </div>
            </div>
        `;
        
        document.getElementById('slideIndicator').innerHTML = `
            <span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-lg border border-indigo-200 w-8 md:w-10 text-center font-bold shadow-inner">${currentSlideIndex + 1}</span> 
            <span class="text-indigo-400">dari</span> 
            <span class="bg-white text-indigo-800 px-3 py-1 rounded-lg border border-indigo-200 w-8 md:w-10 text-center font-bold shadow-sm">${database.length}</span>
        `;
    }

    // ======= LOGIKA PENCARIAN & DROPDOWN =======
    function searchModel(query) {
        const dropdown = document.getElementById('searchDropdown');
        dropdown.innerHTML = '';
        
        if (!query.trim()) { dropdown.classList.add('hidden'); return; }
        
        const results = database.map((model, index) => ({ model, index }))
            .filter(item => item.model.name.toLowerCase().includes(query.toLowerCase()));
            
        if (results.length > 0) {
            results.forEach(result => {
                const div = document.createElement('div');
                div.className = "px-3 md:px-4 py-2 md:py-3 hover:bg-indigo-50 cursor-pointer text-[11px] md:text-sm font-bold text-indigo-900 transition-colors flex justify-between items-center";
                div.innerHTML = `<span>${result.model.name}</span> <span class="text-[9px] md:text-[10px] text-pink-500 bg-pink-50 px-2 py-0.5 rounded-md">Pilih</span>`;
                div.onclick = () => {
                    document.getElementById('searchInput').value = result.model.name;
                    dropdown.classList.add('hidden');
                    if (isTableView) {
                        isTableView = false;
                        compareActive = false;
                        currentSlideIndex = result.index;
                        const nav = document.querySelector('nav');
                        nav.classList.remove('hidden');
                        document.getElementById('searchInput').placeholder = "Cari model...";
                        changeSlide('none');
                    } else if (compareActive && compareSlideIndex === -1) {
                        compareSlideIndex = result.index;
                        changeSlide('none');
                    } else {
                        currentSlideIndex = result.index;
                        compareActive = false;
                        compareSlideIndex = null;
                        document.getElementById('searchInput').placeholder = "Cari model...";
                        changeSlide('none');
                    }
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.remove('hidden');
        } else {
            dropdown.innerHTML = '<div class="px-3 md:px-4 py-2 md:py-3 text-[11px] md:text-sm text-indigo-400 font-bold text-center">Yahh.. tidak ditemukan 🥺</div>';
            dropdown.classList.remove('hidden');
        }
    }

    document.addEventListener('click', (e) => {
        const searchInput = document.getElementById('searchInput');
        const dropdown = document.getElementById('searchDropdown');
        if (e.target !== searchInput && e.target !== dropdown) { dropdown.classList.add('hidden'); }
    });

    // ======= LOGIKA SHARE SEBAGAI GAMBAR =======
    async function shareAsImage() {
        if(database.length === 0) return;
        const btn = document.getElementById('btnShareImg');
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span class="animate-spin text-sm md:text-base">⏳</span> TUNGGU...`;
        btn.classList.add('opacity-80', 'pointer-events-none');
        showToast("Sedang menyiapkan foto...", "sync");

        try {
            if (!window.html2canvas) {
                const script = document.createElement('script');
                script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
                document.head.appendChild(script);
                await new Promise(resolve => script.onload = resolve);
            }

            const model = database[currentSlideIndex];
            const currentImg = model.image ? model.image : DEFAULT_IMAGE;
            const textHargaCMT = model.hargaCMT > 0 ? `Rp ${model.hargaCMT.toLocaleString('id-ID')}` : "Belum Set";

            let rowsHtml = '';
            orderedCategories.forEach(cat => {
                const catItems = model.items.filter(item => item.category === cat);
                if (catItems.length > 0) {
                    let catTotal = 0;
                    catItems.forEach(item => { catTotal += item.price; });
                    rowsHtml += `
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px dashed #e0e7ff; padding-bottom:4px;">
                            <span style="font-weight:700; color:#3730a3; font-size:12px;">${cat}</span>
                            <span style="font-weight:700; color:#db2777; font-size:12px;">Rp ${catTotal.toLocaleString('id-ID')}</span>
                        </div>
                    `;
                }
            });

            const captureDiv = document.createElement('div');
            captureDiv.style.position = 'absolute'; captureDiv.style.left = '-9999px'; captureDiv.style.top = '0';
            captureDiv.style.width = '600px'; captureDiv.style.backgroundColor = '#ffffff'; 
            captureDiv.style.padding = '20px'; captureDiv.style.borderRadius = '24px';
            captureDiv.style.fontFamily = "'Nunito', sans-serif";
            
            captureDiv.innerHTML = `
                <div style="background: linear-gradient(to bottom, #60a5fa, #bfdbfe, #ffedd5); padding: 24px; border-radius: 20px; text-align:center;">
                    <h2 style="font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 900; color: #312e81; margin: 0; text-transform: uppercase;">${model.name}</h2>
                    <p style="margin:4px 0 16px 0; font-size:14px; color:#4338ca; font-weight:bold;">Owlet Kids - Rincian Produksi</p>
                    
                    <div style="background:white; border-radius:16px; padding:12px; margin-bottom:16px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
                        <img src="${currentImg}" style="width:100%; height:250px; object-fit:contain; border-radius:12px;" crossorigin="anonymous">
                    </div>

                    <div style="background: white; border-radius:16px; padding:16px; text-align:left; box-shadow:0 4px 6px rgba(0,0,0,0.1); margin-bottom:16px;">
                        <h4 style="margin:0 0 12px 0; font-family:'Fredoka', sans-serif; color:#4338ca; font-size:16px; text-align:center;">RINGKASAN BIAYA</h4>
                        ${rowsHtml}
                        <div style="display:flex; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:2px solid #e0e7ff;">
                            <span style="font-weight:800; color:#312e81; font-size:14px;">TOTAL HPP</span>
                            <span style="font-weight:900; color:#312e81; font-size:16px;">Rp ${currentTotalHPP.toLocaleString('id-ID')}</span>
                        </div>
                    </div>

                    <div style="background: #fde047; border-radius:16px; padding:16px; box-shadow:0 4px 0 #ca8a04;">
                        <span style="font-size:12px; font-weight:bold; color:#854d0e; text-transform:uppercase;">Harga CMT</span>
                        <div style="font-family:'Fredoka', sans-serif; font-size:32px; font-weight:900; color:#422006; margin-top:4px;">${textHargaCMT}</div>
                    </div>
                </div>
            `;
            document.body.appendChild(captureDiv);

            const canvas = await html2canvas(captureDiv, { scale: 2, useCORS: true, logging: false, backgroundColor: null });
            document.body.removeChild(captureDiv);

            canvas.toBlob(async (blob) => {
                const file = new File([blob], `Owlet_${model.name}.png`, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file], title: 'Rincian Produksi Owlet',
                            text: `Rincian CMT untuk model: ${model.name}`
                        });
                        showToast("Berhasil dibagikan! 📸", "success");
                    } catch (error) {
                        console.log('Share dibatalkan atau gagal', error);
                        showToast("Share dibatalkan.", "sync");
                    }
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `Owlet_${model.name}.png`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast("Foto berhasil diunduh! 📸", "success");
                }
                
                btn.innerHTML = originalText; btn.classList.remove('opacity-80', 'pointer-events-none');
            }, 'image/png');

        } catch (error) {
            console.error("Error share image:", error);
            showToast("Gagal membuat foto 😢", "error");
            btn.innerHTML = originalText; btn.classList.remove('opacity-80', 'pointer-events-none');
        }
    }

    // Eksekusi awal
    fetchSheetData();
   </script>
</body>
</html>
